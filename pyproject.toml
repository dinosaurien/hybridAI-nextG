[tool.poetry]
name = "hybridai-nextg"
version = "0.1.0"
description = ""
authors = ["Wilhelm Rauston <wilhelm.rauston@gmail.com>"]
license = "Apache-2.0"
readme = "README.md"
packages = [{ include = "core", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
numpy = ">=2.3.3,<2.4"
pandas = ">=2.3.2,<3.0.0"
scikit-learn = ">=1.7.2,<2.0.0"
sktime = ">=0.38,<0.39"
pydantic = ">=2.11.9,<3.0.0"
loguru = ">=0.7.3,<0.8.0"
pyarrow = ">=21.0.0,<22.0.0"
numba = "^0.62.0"
llvmlite = "^0.45.0"
matplotlib = "^3.10.6"
websockets = "^15.0.1"
aiohttp = "^3.13.2"
rdflib = "^7.6.0"
torch = "^2.10.0"
huggingface-hub = "^1.10.2"
llama-cpp-python = "^0.3.20"

[tool.poetry.scripts]
train_minirocket = "core.train_minirocket:main"
train_minirocket_xapp = "core.train_minirocket_xapp:main"

[tool.poetry.group.dev.dependencies]
black = "^25.9.0"
ipykernel = "^6.30.1"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
