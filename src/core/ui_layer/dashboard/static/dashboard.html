<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Telecom AI - SB Admin</title>
    <!-- SB Admin CSS -->
    <link href="https://startbootstrap.github.io/startbootstrap-sb-admin/css/styles.css" rel="stylesheet" />
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
    <style>
        /* Preserve some of your specialized "Old UI" styling for the cards */
        .scrollable { height: 300px; overflow-y: auto; background: #f8f9fa; border: 1px solid #dee2e6; }
        .intent-card { border-left: 4px solid #4e73df; margin-bottom: 10px; padding: 10px; background: white; box-shadow: 0 .125rem .25rem rgba(0,0,0,.075); }
        .ue-card { background: #e9ecef; border-radius: 5px; padding: 8px; margin-bottom: 5px; font-size: 0.85rem; }
        .status-dot { height: 10px; width: 10px; background-color: #bbb; border-radius: 50%; display: inline-block; margin-right: 5px; }
        .status-dot.connected { background-color: #2ecc71; box-shadow: 0 0 8px #2ecc71; }
        .procedure-steps { padding-left: 20px; font-size: 0.9rem; }
    </style>
</head>
<body class="sb-nav-fixed">
    <!-- Navbar -->
    <nav class="sb-topnav navbar navbar-expand navbar-dark bg-dark">
        <a class="navbar-brand ps-3" href="#">AI Network Ops</a>
        <button class="btn btn-link btn-sm order-1 order-lg-0 me-4 me-lg-0" id="sidebarToggle"><i class="fas fa-bars"></i></button>
        
        <!-- Intent Input in Top Bar -->
        <div class="d-none d-md-inline-block form-inline ms-auto me-0 me-md-3 my-2 my-md-0 w-50">
            <div class="input-group">
                <input class="form-control" type="text" id="userIntent" placeholder="💬 Inject manual intent..." />
                <button class="btn btn-primary" id="sendIntentBtn" type="button"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
        
        <ul class="navbar-brand navbar-nav ms-auto ms-md-0 me-3 me-lg-4">
            <li class="nav-item">
                <span class="status-dot" id="statusDot"></span>
                <small class="text-muted" id="statusText">Connecting...</small>
            </li>
        </ul>
    </nav>

    <div id="layoutSidenav">
        <div id="layoutSidenav_nav">
            <nav class="sb-sidenav accordion sb-sidenav-dark" id="sidenavAccordion">
                <div class="sb-sidenav-menu">
                    <div class="nav">
                        <div class="sb-sidenav-menu-heading">External Views</div>
                        <a class="nav-link" href="#" onclick="alert('Open Grafana Fullscreen')">
                            <div class="sb-nav-link-icon"><i class="fas fa-chart-area"></i></div> Grafana
                        </a>
                        <a class="nav-link" href="#" onclick="alert('Open CleoPatra Fullscreen')">
                            <div class="sb-nav-link-icon"><i class="fas fa-project-diagram"></i></div> CleoPatra
                        </a>
                        
                        <div class="sb-sidenav-menu-heading">Sim Control</div>
                        <button class="btn btn-outline-danger mx-3 mb-2 btn-sm" onclick="quickIntent('BREAK_SIM: LATENCY_SPIKE')">Inject Latency</button>
                        <button class="btn btn-outline-warning mx-3 btn-sm" onclick="quickIntent('BREAK_SIM: PACKET_LOSS')">Drop Packets</button>
                    </div>
                </div>
            </nav>
        </div>

        <div id="layoutSidenav_content">
            <main>
                <div class="container-fluid px-4">
                    <h1 class="mt-4">Live Dashboard</h1>
                    
                    <!-- KPI Cards Row -->
                    <div class="row">
                        <div class="col-xl-3 col-md-6">
                            <div class="card bg-primary text-white mb-4">
                                <div class="card-body">gNB Latency (ms)</div>
                                <div class="card-footer d-flex align-items-center justify-content-between">
                                    <h2 id="gnbLatency">--</h2>
                                </div>
                            </div>
                        </div>
                        <div class="col-xl-3 col-md-6">
                            <div class="card bg-success text-white mb-4">
                                <div class="card-body">Active UEs</div>
                                <div class="card-footer d-flex align-items-center justify-content-between">
                                    <h2 id="ueCountBadge">0</h2>
                                </div>
                            </div>
                        </div>
                        <div class="col-xl-6 col-md-12">
                            <div class="card bg-secondary text-white mb-4">
                                <div class="card-body">Cell Identity</div>
                                <div class="card-footer d-flex align-items-center justify-content-between">
                                    <span id="cellId">--</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <!-- LEFT COLUMN: Intents & Active Logic -->
                        <div class="col-lg-8">
                            <div class="card mb-4">
                                <div class="card-header"><i class="fas fa-brain me-1"></i> Active Intents (<span id="intentCount">0</span>)</div>
                                <div class="card-body scrollable" style="height: 500px;" id="intentsList">
                                    <div class="empty-state text-muted text-center mt-5">No active intents</div>
                                </div>
                            </div>
                        </div>

                        <!-- RIGHT COLUMN: UE Metrics Table -->
                        <div class="col-lg-4">
                            <div class="card mb-4">
                                <div class="card-header"><i class="fas fa-users me-1"></i> UE Metrics</div>
                                <div class="card-body scrollable" id="ueMetricsList">
                                    <div class="empty-state text-muted text-center mt-5">No UE data</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <!-- BOTTOM: Deviations and Commands -->
                        <div class="col-md-6">
                            <div class="card mb-4">
                                <div class="card-header bg-warning text-dark"><i class="fas fa-exclamation-triangle me-1"></i> Deviations (<span id="deviationCount">0</span>)</div>
                                <div class="card-body scrollable" id="deviationsList"></div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="card mb-4">
                                <div class="card-header bg-info text-white"><i class="fas fa-terminal me-1"></i> Actuator Logs (<span id="commandCount">0</span>)</div>
                                <div class="card-body scrollable" id="commandsList"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // --- API HELPERS ---
        async function sendIntent() {
            const input = document.getElementById('userIntent');
            const text = input.value.trim();
            if (!text) return;
            await quickIntent(text);
            input.value = "";
        }

        async function quickIntent(text) {
            try {
                const res = await fetch('/api/intent', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ text: text })
                });
                console.log("Intent Sent:", text);
            } catch (e) { console.error("Error sending intent", e); }
        }

        // --- DASHBOARD CLIENT (Logic from your OLD JS) ---
        class DashboardClient {
            constructor() {
                this.ws = null;
                this.intents = new Map();
                this.deviations = [];
                this.commands = [];
                
                // DOM Mappings
                this.statusDot = document.getElementById('statusDot');
                this.statusText = document.getElementById('statusText');
                this.intentsList = document.getElementById('intentsList');
                this.deviationsList = document.getElementById('deviationsList');
                this.commandsList = document.getElementById('commandsList');
                this.intentCount = document.getElementById('intentCount');
                this.deviationCount = document.getElementById('deviationCount');
                this.commandCount = document.getElementById('commandCount');
                this.gnbLatency = document.getElementById('gnbLatency');
                this.cellId = document.getElementById('cellId');
                this.ueCountBadge = document.getElementById('ueCountBadge');
                this.ueMetricsList = document.getElementById('ueMetricsList');

                this.connect();
            }

            connect() {
                const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                const wsUrl = `${protocol}//${window.location.host}/ws`;
                this.ws = new WebSocket(wsUrl);

                this.ws.onopen = () => {
                    this.statusDot.classList.add('connected');
                    this.statusText.textContent = 'Connected';
                };
                this.ws.onclose = () => {
                    this.statusDot.classList.remove('connected');
                    this.statusText.textContent = 'Disconnected';
                    setTimeout(() => this.connect(), 3000);
                };
                this.ws.onmessage = (event) => this.onMessage(event);
            }

            onMessage(event) {
                const message = JSON.parse(event.data);
                switch (message.type) {
                    case 'intent': this.handleIntent(message.data); break;
                    case 'deviation': this.handleDeviation(message.data); break;
                    case 'command': this.handleCommand(message.data); break;
                    case 'kpi': this.handleKPI(message.data); break;
                }
            }

            handleKPI(data) {
                const { cell, ues } = data;
                // Match the EXACT keys from your backend/sim
                if (cell && cell.DRB_PdcpSduDelayDl !== undefined) {
                    this.gnbLatency.textContent = cell.DRB_PdcpSduDelayDl.toFixed(2);
                }
                if (cell && cell.cell_id) {
                    this.cellId.textContent = cell.cell_id;
                }
                if (ues) {
                    this.ueCountBadge.textContent = ues.length;
                    this.renderUEMetrics(ues);
                }
            }

            renderUEMetrics(ues) {
                this.ueMetricsList.innerHTML = ues.map(ue => `
                    <div class="ue-card">
                        <strong>📱 UE: ${ue.ue_id}</strong><br>
                        Lat: ${ue.UE_DRB_PdcpSduDelayDl_UEID?.toFixed(2) || '--'} ms | 
                        Thp: ${(ue.UE_DRB_UEThpDl_UEID / 1e6 || 0).toFixed(2)} Mbps
                    </div>
                `).join('');
            }

            handleIntent(data) {
                if (!data || Object.keys(data).length === 0) this.intents.clear();
                else this.intents.set(data.intent_id || 'unknown', data);
                this.renderIntents();
            }

            renderIntents() {
                this.intentCount.textContent = this.intents.size;
                this.intentsList.innerHTML = Array.from(this.intents.values()).map(intent => `
                    <div class="intent-card">
                        <h6><strong>Intent:</strong> ${intent.intent_name || 'Optimizing'}</h6>
                        <ol class="procedure-steps">
                            ${(intent.procedure || []).map(step => `<li>${typeof step === 'object' ? step.action : step}</li>`).join('')}
                        </ol>
                    </div>
                `).join('') || '<div class="text-center mt-5">No active intents</div>';
            }

            handleDeviation(data) {
                this.deviations.unshift(data);
                this.deviationCount.textContent = this.deviations.length;
                this.deviationsList.innerHTML = this.deviations.slice(0, 20).map(d => `
                    <div class="p-1 border-bottom small">⚠️ ${d.metric}: <strong>${d.value?.toFixed(2)}</strong></div>
                `).join('');
            }

            handleCommand(data) {
                this.commands.unshift(data);
                this.commandCount.textContent = this.commands.length;
                this.commandsList.innerHTML = this.commands.slice(0, 20).map(c => `
                    <div class="p-1 border-bottom small font-monospace">📡 ${c.command} (${JSON.stringify(c.params)})</div>
                `).join('');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            new DashboardClient();
            document.getElementById('sendIntentBtn').onclick = sendIntent;
            document.getElementById('userIntent').onkeypress = (e) => { if(e.key==='Enter') sendIntent(); };
            
            // SB Admin Sidebar Toggle
            document.getElementById('sidebarToggle').onclick = e => {
                e.preventDefault();
                document.body.classList.toggle('sb-sidenav-toggled');
            };
        });
    </script>
</body>
</html>
