<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Network Optimizer - Live Dashboard</title>
    
    <!-- Link to CSS in the static folder -->
    <link rel="stylesheet" href="static/dashboard.css">
    
    <style>
        /* Minimal extra styling for the new input panel, 
           you can move this to dashboard.css if you prefer */
        .input-panel { 
            grid-column: 1 / -1; 
            background: #2d2d2d; 
            padding: 15px; 
            border-radius: 8px; 
            display: flex; 
            gap: 10px; 
            align-items: center; 
            margin-bottom: 20px;
        }
        .input-panel input { 
            flex: 1; 
            padding: 12px; 
            background: #1a1a1a; 
            border: 1px solid #444; 
            color: white; 
            border-radius: 4px; 
            font-size: 1rem;
        }
        .input-panel button { 
            padding: 12px 24px; 
            background: #007bff; 
            color: white; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 1rem;
            transition: background 0.2s;
        }
        .input-panel button:hover { 
            background: #0056b3; 
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1>🤖 AI Network Optimizer</h1>
                <div class="connection-status">
                    <span class="status-dot" id="statusDot"></span>
                    <span id="statusText">Connecting...</span>
                </div>
            </div>
        </header>

        <!-- Main Grid -->
        <div class="dashboard-grid">
            
            <!-- NEW: Intent Input Panel -->
            <section class="input-panel">
                <input type="text" id="userIntent" placeholder="💬 Type a new intent (e.g. 'Prepare for concert', 'Reduce power')...">
                <button id="sendIntentBtn">Inject Intent</button>
            </section>

            <!-- Active Intents Panel -->
            <section class="panel intent-panel">
                <div class="panel-header">
                    <h2>🎯 Reasoner - Intents</h2>
                    <span class="badge" id="intentCount">0</span>
                </div>
                <div class="panel-content" id="intentsList">
                    <div class="empty-state">No active intents</div>
                </div>
            </section>

            <!-- Recent Deviations Panel -->
            <section class="panel deviation-panel">
                <div class="panel-header">
                    <h2>⚠️ Minirocket - Deviations</h2>
                    <span class="badge" id="deviationCount">0</span>
                </div>
                <div class="panel-content scrollable" id="deviationsList">
                    <div class="empty-state">No deviations detected</div>
                </div>
            </section>

            <!-- Commands Log Panel -->
            <section class="panel command-panel">
                <div class="panel-header">
                    <h2>📡 Actuator</h2>
                    <span class="badge" id="commandCount">0</span>
                </div>
                <div class="panel-content scrollable" id="commandsList">
                    <div class="empty-state">No commands sent</div>
                </div>
            </section>

            <!-- KPI Metrics Panel -->
            <section class="panel kpi-panel">
                <div class="panel-header">
                    <h2>📊 Observer - KPI Metrics</h2>
                    <span class="badge" id="ueCountBadge">0</span>
                </div>
                <div class="panel-content">
                    <!-- gNB Metrics -->
                    <div class="gnb-metric-card">
                        <div class="metric-header">📡 gNB (Cell-Level)</div>
                        <div class="metric-row">
                            <span class="metric-label">Latency:</span>
                            <span class="metric-value" id="gnbLatency">--</span>
                            <span class="metric-unit">ms</span>
                        </div>
                        <div class="metric-row">
                            <span class="metric-label">Cell ID:</span>
                            <span class="metric-value small" id="cellId">--</span>
                        </div>
                    </div>

                    <!-- UE Metrics List -->
                    <div class="ue-metrics-header">👥 User Equipment</div>
                    <div class="ue-metrics-list" id="ueMetricsList">
                        <div class="empty-state">No UE data</div>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <!-- Link to JS in the static folder -->
    <script src="static/dashboard.js"></script>
</body>
</html>
